name: Flutter Build (Android & iOS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # امکان اجرای دستی از داخل پنل گیت‌هاب

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: cd app && flutter pub get
        
      - name: Build APK
        run: cd app && flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS (No Codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: cd app && flutter pub get
        
      - name: Build iOS
        run: cd app && flutter build ios --release --no-codesign
        
      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: app/build/ios/iphoneos/Runner.app
