<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود اپلیکیشن هفت روز</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #111; color: #fff; text-align: center; margin: 0; padding: 0; }
        .container { padding: 40px 20px; max-width: 500px; margin: auto; }
        .logo { color: gold; font-size: 2.5em; margin-bottom: 10px; }
        p { color: #ccc; line-height: 1.8; font-size: 0.95em; }
        .btn { display: block; width: 100%; padding: 14px; margin: 15px 0; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 1.1em; transition: 0.3s; box-sizing: border-box; }
        .btn-gold { background: linear-gradient(45deg, #FFD700, #DAA520); color: #000; box-shadow: 0 4px 15px rgba(218, 165, 32, 0.4); }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(218, 165, 32, 0.6); }
        .btn-outline { border: 1.5px solid #444; color: #ddd; background: #1a1a1a; }
        .btn-outline:hover { background: #252525; border-color: #666; color: #fff; }
        .icon { width: 130px; height: 130px; border-radius: 26px; margin: 20px auto; display: block; border: 3px solid gold; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
        .badge { background: #222; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; font-size: 0.85em; color: #aaa; display: inline-block; margin-bottom: 15px; }
        .sublink { font-size: 0.85em; color: #888; text-decoration: underline; margin-top: -8px; margin-bottom: 15px; display: block; }
        .sublink:hover { color: gold; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">هفت روز</h1>
        <p>بهترین پلتفرم قصه‌گویی و شنیدن داستان‌های صوتی زیبا با صدای شما</p>
        
        <img src="icon.jpg" alt="هفت روز" class="icon" onerror="this.style.display='none'">

        <div class="badge">نسخه ۱.۰.۱ (فشرده و بهینه‌شده)</div>

        <a href="/haftroz_lite.apk" class="btn btn-gold">📥 دانلود مستقیم اندروید (۱۷ مگابایت)</a>
        <a href="/haftroz_lite_v7a.apk" class="sublink">برای گوشی‌های قدیمی‌تر (نسخه ۳۲ بیتی - ۱۴ مگابایت)</a>

        <a href="#" class="btn btn-outline" onclick="alert('به زودی پس از تایید نهایی در گوگل پلی در دسترس قرار خواهد گرفت.')">▶️ دریافت از گوگل پلی (Google Play)</a>
        <a href="#" class="btn btn-outline" onclick="alert('نسخه تحت وب / وب‌اپلیکیشن PWA به زودی منتشر می‌شود.')">🌐 ورود به نسخه وب‌اپلیکیشن</a>
        
        <br><br>
        <a href="/" style="color: gold; text-decoration: none; font-size: 0.9em;">← بازگشت به صفحه اصلی هفت روز</a>
    </div>
</body>
</html>
