<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود اپلیکیشن هفت روز</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #111; color: #fff; text-align: center; margin: 0; padding: 0; }
        .container { padding: 50px 20px; max-width: 600px; margin: auto; }
        .logo { color: gold; font-size: 3em; margin-bottom: 10px; }
        p { color: #ccc; line-height: 1.8; }
        .btn { display: block; width: 100%; padding: 15px; margin: 20px 0; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 1.2em; transition: 0.3s; box-sizing: border-box; }
        .btn-gold { background: linear-gradient(45deg, #FFD700, #DAA520); color: #000; box-shadow: 0 4px 15px rgba(218, 165, 32, 0.4); }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(218, 165, 32, 0.6); }
        .btn-outline { border: 2px solid #555; color: #fff; }
        .btn-outline:hover { background: #222; }
        .icon { width: 150px; height: 150px; border-radius: 30px; margin: 20px auto; display: block; border: 3px solid gold; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">هفت روز</h1>
        <p>بهترین پلتفرم قصه گویی و شنیدن داستان‌های زیبا با صدای شما</p>
        
        <img src="icon.jpg" alt="هفت روز" class="icon" onerror="this.style.display='none'">

        <a href="/haftroz_v2.apk" class="btn btn-gold">📥 دانلود مستقیم اندروید (APK)</a>
        <a href="#" class="btn btn-outline" onclick="alert('به زودی در گوگل پلی قرار می‌گیرد')">▶️ دانلود از گوگل پلی</a>
        <a href="#" class="btn btn-outline" onclick="alert('نسخه iOS به زودی منتشر می‌شود')">🍎 دانلود نسخه iOS (سیب‌اپ)</a>
        
        <br><br><br>
        <a href="/" style="color: gold; text-decoration: none;">بازگشت به صفحه اصلی</a>
    </div>
</body>
</html>
